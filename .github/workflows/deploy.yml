name: Deploy boxit.pk

# Runs on every merge to main, or on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys touch the server at once, and never cancel one
# part-way through a build on the box.
concurrency:
  group: deploy-boxit-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Add a required reviewer to this environment in Settings -> Environments
    # if you ever want deploys to wait for approval.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Load deploy key and pin the host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # tr -d '\r': these secrets are pasted by hand, often out of a file
          # on Windows. A stray CR makes OpenSSH reject the key with a useless
          # "invalid format", so strip them here instead.
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned from a secret rather than StrictHostKeyChecking=no, so a
          # spoofed host can never receive the deploy key.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Fail here, with a sentence that says what to fix, rather than forty
          # lines later with a bare "Permission denied (publickey)".
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "!! VPS_SSH_KEY is not a usable private key — paste the whole" >&2
            echo "   file, BEGIN/END lines included. See DEPLOY.md." >&2
            exit 1
          fi
          if ! [ -s ~/.ssh/known_hosts ]; then
            echo "!! VPS_KNOWN_HOSTS is empty — see DEPLOY.md step 3." >&2
            exit 1
          fi
          echo "deploy key: $(ssh-keygen -lf ~/.ssh/id_deploy | awk '{print $2, $3}')"

      - name: Build and restart on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          APP_ROOT: ${{ vars.VPS_APP_ROOT || '/var/www/boxit' }}
          RESTART_CMD: ${{ vars.VPS_RESTART_CMD || 'pm2 restart boxit --update-env' }}
          REPO_URL: ${{ vars.VPS_REPO_URL || format('https://github.com/{0}.git', github.repository) }}
          BRANCH: ${{ github.ref_name }}
          HEALTH_URL: ${{ vars.VPS_HEALTH_URL || 'http://127.0.0.1:3002/' }}
        run: |
          set -euo pipefail
          # printf %q quotes each value for the remote shell, which re-parses
          # the command string — so paths or restart commands containing
          # spaces survive intact.
          ARGS=$(printf '%q %q %q %q %q'             "$APP_ROOT" "$RESTART_CMD" "$REPO_URL" "$BRANCH" "${HEALTH_URL:-}")
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST" \
              "bash -s -- $ARGS" < scripts/deploy-remote.sh

      - name: Scrub the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
